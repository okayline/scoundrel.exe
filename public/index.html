<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scoundrel.exe</title>
<meta name="description" content="A daily Scoundrel deck. Everyone gets the same 44 cards. One run.">
<style>
  /* VT323, self-hosted (fonts/OFL.txt has its license). The look follows Daily Digital Demon Dungeon. */
  @font-face { font-family: "VT323"; src: url("fonts/VT323-Regular.ttf") format("truetype"); font-weight: 400; font-style: normal; font-display: swap; }
  :root {
    --bg: #07090a;
    --fg: #e4e4df;
    --dim: #4f5d52;
    --trail: #8f8f8a;
    --bright: #ffffff;
    --demon: #e0564a;
    --gold: #e3b341;
    --moon: #9fc4ff;
  }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { -webkit-user-select: none; user-select: none; }
  body {
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 16px; box-sizing: border-box;
    font-family: "VT323", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    font-variant-ligatures: none;      /* VT323 joins fl, fi and ff into one cell, which would pull a border a column left */
  }
  .frame { max-width: 100%; overflow-x: auto; }
  pre {
    margin: 0; font-family: inherit; line-height: 1.05;
    font-size: clamp(6px, calc((100vw - 32px) / 49), 22px); white-space: pre;
  }
  /* symbols: always exactly one column, whatever font ends up drawing them */
  .g { display: inline-block; width: 1ch; text-align: center; overflow: visible; line-height: 0;
       font-family: "VT323", "DejaVu Sans Mono", Menlo, Consolas, "Segoe UI Symbol", monospace; }
  .fr { color: var(--trail); }
  .dim { color: var(--dim); }
  .dimmer { color: var(--trail); }
  .flavor { color: var(--trail); }
  .logo { color: var(--bright); }
  /* black and white, like DDDD: the only color is the suit in the middle of a card */
  .demon, .blade, .ichor, .gold, .hp { color: var(--fg); }
  .you { color: var(--bright); }
  .card, .btn.card { color: var(--fg); }   /* cards are plain; only their middle suit has color */
  .card.s-heart { color: var(--demon); }   /* the suit in the middle of a card: hearts red, diamonds blue */
  .card.s-diamond { color: var(--moon); }
  .marks { color: var(--fg); letter-spacing: 0; }
  .btn { cursor: pointer; color: var(--bright); }
  .clk { cursor: pointer; }   /* cards: clickable, no highlight (the v above shows which one) */
  .btn:hover { background: var(--fg); color: var(--bg); }
  .btn.off { color: var(--dim); cursor: default; }
  .btn.off:hover { background: none; color: var(--dim); }
  .btn.armed { background: var(--bright); color: var(--bg); }
  .nameinput { background: var(--bg); color: var(--fg); border: none; outline: 1px solid var(--trail); font: inherit; padding: 0; margin: 0;
               box-sizing: border-box; text-transform: uppercase; vertical-align: top; height: 1.05em; user-select: text; }
  .nameinput.bad { outline-color: var(--bright); outline-width: 2px; }
  .ver { align-self: flex-end; font-size: 12px; color: var(--trail); padding: 2px 1ch 0 0; letter-spacing: 0.05em; }
  .wrap { display: flex; flex-direction: column; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="frame"><pre id="screen" aria-live="polite">LOADING...</pre></div>
    <div id="ver" class="ver"></div>
  </div>
  <script src="app.js?v=0.5.0" defer></script>
</body>
</html>
